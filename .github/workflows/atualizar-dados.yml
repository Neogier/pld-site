name: Atualizar dados CCEE

on:
  workflow_dispatch:
    inputs:
      forcar_email:
        description: "Reenviar o e-mail do proximo dia mesmo que ja tenha sido enviado (teste)"
        type: boolean
        default: false
      email_teste:
        description: "Enviar agora um e-mail de TESTE com a tabela de hoje"
        type: boolean
        default: false
  # RESERVA: o caminho principal e o servidor neogier-bot (neogier-bot/pld/atualizar_pld.sh),
  # que roda a cada 5 min. Estes horarios so cobrem o caso de o servidor estar fora;
  # quando ele ja publicou, esta execucao nao muda nada nem manda e-mail de novo.
  schedule:
    # Horarios em UTC (Brasilia = UTC-3): 18:40, 20:20 e 22:10 de Brasilia.
    - cron: "40 21 * * *"
    - cron: "20 23 * * *"
    - cron: "10 1 * * *"
    # 00:20 de Brasilia: vira o "hoje" para o novo dia.
    - cron: "20 3 * * *"

permissions:
  contents: write

# Evita duas execucoes ao mesmo tempo disputando o push.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar dados.json
        run: |
          python atualizar_dados.py

      # O servidor pode ter mandado o e-mail depois do checkout: pega o controle de
      # envio mais recente para nao mandar de novo.
      - name: Atualizar controle de envio
        if: ${{ !cancelled() }}
        run: |
          git fetch -q origin main && git show origin/main:notificacao.json > notificacao.json || true

      # Roda mesmo se a consulta a CCEE falhar: se o Sergio publicou o dados.json
      # pelo Termux, o e-mail sai com os dados dele.
      - name: Enviar e-mail do proximo dia
        if: ${{ !cancelled() }}
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          FORCAR_ENVIO: ${{ inputs.forcar_email }}
          EMAIL_TESTE: ${{ inputs.email_teste }}
        run: |
          python enviar_email.py

      # Roda mesmo se o e-mail falhar, para o site nao deixar de ser atualizado.
      - name: Commitar dados.json se houve alteracao
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados.json
          for arquivo in notificacao.json pld-imagens.json pld-ontem.png pld-hoje.png pld-proximo-dia.png; do
            if [ -f "$arquivo" ]; then git add "$arquivo"; fi
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao em dados.json"
          else
            git commit -m "Atualiza dados.json automaticamente"
            # O Sergio ainda pode commitar manualmente; traz as mudancas dele antes do push.
            # Em conflito no dados.json, vale o que acabou de ser gerado aqui ("theirs" no rebase).
            git pull --rebase -X theirs origin main
            git push
          fi

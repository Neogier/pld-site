name: Atualizar dados CCEE

on:
  workflow_dispatch:
  schedule:
    # Horarios em UTC (Brasilia = UTC-3).
    # 17:00-21:50 de Brasilia, a cada 10 min: janela em que a CCEE publica o PLD do dia seguinte.
    - cron: "*/10 20-23 * * *"
    - cron: "*/10 0 * * *"
    # 00:05 de Brasilia: vira o "hoje" para o novo dia.
    - cron: "5 3 * * *"

permissions:
  contents: write

# Evita duas execucoes ao mesmo tempo disputando o push.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar dados.json
        run: |
          python atualizar_dados.py

      - name: Commitar dados.json se houve alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao em dados.json"
          else
            git commit -m "Atualiza dados.json automaticamente"
            # O Sergio ainda pode commitar manualmente; traz as mudancas dele antes do push.
            # Em conflito no dados.json, vale o que acabou de ser gerado aqui ("theirs" no rebase).
            git pull --rebase -X theirs origin main
            git push
          fi

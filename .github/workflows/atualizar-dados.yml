name: Atualizar dados CCEE

on:
  workflow_dispatch:
    inputs:
      forcar_email:
        description: "Reenviar o e-mail do proximo dia mesmo que ja tenha sido enviado (teste)"
        type: boolean
        default: false
      email_teste:
        description: "Enviar agora um e-mail de TESTE com a tabela de hoje"
        type: boolean
        default: false
  schedule:
    # Horarios em UTC (Brasilia = UTC-3).
    # 17:00-21:50 de Brasilia, a cada 10 min: janela em que a CCEE publica o PLD do dia seguinte.
    - cron: "*/10 20-23 * * *"
    - cron: "*/10 0 * * *"
    # 00:05 de Brasilia: vira o "hoje" para o novo dia.
    - cron: "5 3 * * *"

permissions:
  contents: write

# Evita duas execucoes ao mesmo tempo disputando o push.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar dados.json
        run: |
          python atualizar_dados.py

      # Roda mesmo se a consulta a CCEE falhar: se o Sergio publicou o dados.json
      # pelo Termux, o e-mail sai com os dados dele.
      - name: Enviar e-mail do proximo dia
        if: ${{ !cancelled() }}
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          FORCAR_ENVIO: ${{ inputs.forcar_email }}
          EMAIL_TESTE: ${{ inputs.email_teste }}
        run: |
          python enviar_email.py

      # Roda mesmo se o e-mail falhar, para o site nao deixar de ser atualizado.
      - name: Commitar dados.json se houve alteracao
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados.json
          if [ -f notificacao.json ]; then git add notificacao.json; fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao em dados.json"
          else
            git commit -m "Atualiza dados.json automaticamente"
            # O Sergio ainda pode commitar manualmente; traz as mudancas dele antes do push.
            # Em conflito no dados.json, vale o que acabou de ser gerado aqui ("theirs" no rebase).
            git pull --rebase -X theirs origin main
            git push
          fi
